<form>
    <div class="modal-header">
        <ui-modal-cross></ui-modal-cross>
        <h2 class="modal-header-title">{{ctrl.type == "add" ? "Новый склад" : "Редактирование склада"}}</h2>
    </div>
    <div class="modal-body">

        <div class="form-group row">
            <label class="col-xs-4 control-label">
                <span class="text-required">Код</span>
            </label>
            <div class="col-xs-8">
                <input type="text" class="form-control" ng-model="ctrl.depot.Code" required validation-input-text="Код" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-xs-4 control-label">
                <span class="text-required">Наименование</span>
            </label>
            <div class="col-xs-8">
                <input type="text" class="form-control" ng-model="ctrl.depot.Name" required validation-input-text="Наименование" autofocus />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-xs-4 control-label">
                <span class="text-required">Наименование видимое</span>
            </label>
            <div class="col-xs-8">
                <input type="text" class="form-control" ng-model="ctrl.depot.Title" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-xs-4 control-label">
                <span class="text-required">Подсказка</span>
            </label>
            <div class="col-xs-8">
                <textarea class="form-control" ng-model="ctrl.depot.Hint" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-xs-4 control-label">{{'Admin.Js.AddEditUser.Department'|translate}}</label>
            <div class="col-xs-8">
                <select data-e2e="userDepartment" ng-model="ctrl.depot.DepartmentId" ng-options="s.value as s.label for s in ctrl.departments" class="form-control" convert-to-number>
                    <option value="">{{'Admin.Js.AddEditUser.NotSelected'|translate}}</option>
                </select>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-xs-4 control-label">
                Сортировка
            </label>
            <div class="col-xs-8">
                <input type="text" class="form-control" ng-model="ctrl.depot.SortOrder" />
            </div>
        </div>

        <div class="form-group row">
            <label class="col-xs-4 control-label">
                Активен
            </label>
            <div class="col-xs-8">
                <label class="adv-checkbox-label">
                    <input type="checkbox" class="adv-checkbox-input control-checkbox" ng-model="ctrl.depot.Active" ng-disabled="ctrl.depot.Main == true" />
                    <span class="adv-checkbox-emul"></span>
                </label>
            </div>
        </div>

    </div>
    <div class="modal-footer">
        <button class="btn btn-save btn-primary" type="button" data-button-validation-success="ctrl.save()" data-button-validation>Сохранить</button>
        <button class="btn btn-default btn-cancel" type="button" ng-click="ctrl.close()">Отмена</button>
    </div>
</form>
